# Nginx 反向代理配置 — 企业知识助手
# 前端静态资源 + API 反向代理到 FastAPI 后端

upstream knowledge_app {
    server 127.0.0.1:8008;
    # 多实例时追加：server 127.0.0.1:8009;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 前端静态资源（由 Nginx 直接缓存）
    location /static/ {
        alias /app/serve/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # 字体/JS 声明 UTF-8
        types { text/css css; application/javascript js; }
        charset utf-8;
        access_log off;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://knowledge_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # Swagger 文档
    location /docs {
        proxy_pass http://knowledge_app;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://knowledge_app;
    }

    # 首页（前端 SPA）
    location / {
        proxy_pass http://knowledge_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
