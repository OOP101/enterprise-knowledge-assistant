# 企业知识助手 — 生产级 Docker Compose
# 服务：Nginx 反向代理 + FastAPI 后端(含前端静态资源)
# 使用：docker compose up -d

services:
  # ===== FastAPI 后端（含前端静态资源）=====
  app:
    build: .                                   # 使用根目录 Dockerfile 构建
    container_name: knowledge-app
    ports:
      - "8008:8008"                            # 宿主机:容器端口映射
    # 环境变量从宿主机 .env 读取，未设置时使用默认值兜底
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}           # 留空则进入演示模式
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-dashscope}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v3}
      - EMBEDDING_LOCAL_MODEL=${EMBEDDING_LOCAL_MODEL:-BAAI/bge-small-zh-v1.5}
      - VECTOR_STORE=${VECTOR_STORE:-chroma}
      - CHROMA_PERSIST_DIR=/app/vector_db     # 容器内固定路径，配合 volume 持久化
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-enterprise_knowledge}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-demo}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-prod}   # ⚠ 生产必须改写
      - DEFAULT_KB_ID=${DEFAULT_KB_ID:-default}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}    # ⚠ 生产必须改写
      - HOST=0.0.0.0
      - PORT=8008
    volumes:
      - ./vector_db:/app/vector_db             # 向量库持久化（避免容器重建丢数据）
      - ./data:/app/data                       # 运行时数据（文档/用户/反馈/缓存）
      # 本地模型缓存（EMBEDDING_PROVIDER=local 时生效）
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped                    # 崩溃/重启后自动拉起
    healthcheck:                               # 通过 /api/health 探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s                        # 启动宽限期，避免冷启动误判

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: knowledge-nginx
    ports:
      - "80:80"                                # 对外暴露 80 端口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 反向代理配置（只读）
      - ./serve/static:/app/serve/static:ro    # 前端静态资源（只读）
    depends_on:
      app:
        condition: service_healthy             # 等待后端健康后才启动
    restart: unless-stopped

  # 生产环境向量库（可选，启用时设置 VECTOR_STORE=milvus）
  # milvus:
  #   image: milvusdb/milvus:v2.5.0
